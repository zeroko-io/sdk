name: ci

# The packages built and type-checked, and every example built, deployed to
# a runner (the runner's published image, in Docker) and asked what it
# answers. Changes to docs only run nothing.
on:
  push:
    branches: [main]
    paths: &code
      - "**"
      - "!**.md"
      - "!LICENSE"
  pull_request:
    paths: *code
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push cancels its older run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx turbo run build typecheck --filter=./packages/*
      - run: node --test test/config.test.mjs
      - run: docker pull ghcr.io/zeroko-io/runner:latest
      - run: node test/e2e.mjs
